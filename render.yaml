services:
  - type: web
    name: swiftdrop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swiftdrop-db
          property: connectionString

databases:
  - name: swiftdrop-db
    databaseName: swiftdrop
    user: swiftdrop
    plan: basic-256mb
